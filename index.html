<head>
  <meta charset="UTF-8">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
    }

    /* =========================
       SPLASH SCREEN
       ========================= */

    #splashScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(
        180deg,
        #ed1261 0%,
        #ff382e 50%,
        #ff4b17 100%
      );

      animation: backgroundChange 2s ease-in-out forwards;

      z-index: 99999;
    }

    .splashContent {
      width: 100%;
      text-align: center;
      padding: 20px;
      color: white;
    }

    /* मुख्य नाम */

    .appTitle {
      font-size: clamp(42px, 11vw, 72px);
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 28px;

      animation: titleFade 1s ease-out;
    }

    /* दूसरा टेक्स्ट */

    .appSubtitle {
      font-size: clamp(20px, 5.5vw, 32px);
      font-weight: 500;
      line-height: 1.5;

      animation: subtitleFade 1.2s ease-out;
    }

    /* तीसरा टेक्स्ट */

    .appTagline {
      margin-top: 22px;

      font-size: clamp(17px, 4.5vw, 25px);
      font-style: italic;
      line-height: 1.6;

      opacity: 0.92;

      animation: subtitleFade 1.5s ease-out;
    }

    /* Loading circle */

    .loader {
      width: 82px;
      height: 82px;

      margin: 70px auto 0;

      border-radius: 50%;

      border: 8px solid rgba(255, 255, 255, 0.25);
      border-top-color: white;

      animation:
        spin 1s linear infinite,
        loaderFade 1s ease-out;
    }

    /* =========================
       ANIMATIONS
       ========================= */

    @keyframes backgroundChange {
      0% {
        background: linear-gradient(
          180deg,
          #e91661,
          #ff303c,
          #ff4918
        );
      }

      50% {
        background: linear-gradient(
          180deg,
          #8e2de2,
          #ff416c,
          #ff512f
        );
      }

      100% {
        background: linear-gradient(
          180deg,
          #ff512f,
          #f12711,
          #ff4b17
        );
      }
    }

    @keyframes titleFade {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes subtitleFade {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes loaderFade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>

<script type="module">
(async function(){
  const FB="https://www.gstatic.com/firebasejs/12.18.0/";
  const [{initializeApp,getApps,getApp},{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence},{getFirestore,collection,query,where,getDocs,getDoc,doc,setDoc,updateDoc,addDoc,serverTimestamp,orderBy,limit,onSnapshot,deleteDoc}] = await Promise.all([
    import(FB+"firebase-app.js"), import(FB+"firebase-auth.js"), import(FB+"firebase-firestore.js")
  ]);
  const firebaseConfig={
    apiKey:"AIzaSyCOWrCyxMdLoevvOPyuXL6V3DP0mMfo5fU",
    authDomain:"parmatma-ek-e561d.firebaseapp.com",
    projectId:"parmatma-ek-e561d",
    storageBucket:"parmatma-ek-e561d.firebasestorage.app",
    messagingSenderId:"477168010558",
    appId:"1:477168010558:web:ae27b57110a6fc1ff1586f",
    measurementId:"G-CJTPB27P1B"
  };
  const app=getApps().length?getApp():initializeApp(firebaseConfig);
  const auth=getAuth(app),db=getFirestore(app);
  try{ await setPersistence(auth,browserLocalPersistence); }catch(e){ console.warn("Auth persistence:",e); }
  let currentUser=null,currentProfile=null,stopPosts=null;

  const root=document.createElement("div");root.id="peV2Root";document.body.appendChild(root);

  const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
  const avatar=u=>u?.profilePhotoURL||u?.profilePhotoData||u?.profilePhotoLocal||"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="100%" height="100%" fill="#e9eef5"/><circle cx="60" cy="42" r="24" fill="#1976d2"/><path d="M22 112c5-31 71-31 76 0" fill="#1976d2"/></svg>');
  const roleLabel=r=>r==="margdarshak"?"👑 मार्गदर्शक":r==="sevak"?"👥 सेवक":r==="admin"?"🛡️ Admin":"👤 सदस्य";

  async function findProfile(uid){
    if(!uid)return null;
    try{
      const direct=await getDoc(doc(db,"users",uid));
      if(direct.exists())return {id:direct.id,...direct.data()};
      const s=await getDocs(query(collection(db,"users"),where("uid","==",uid),limit(1)));
      if(!s.empty)return {id:s.docs[0].id,...s.docs[0].data()};
    }catch(e){console.warn("profile read",e)}
    return null;
  }
  async function ensureProfile(){
    const storedUid=localStorage.getItem("parmatmaEkAuthUid");
    if(!currentUser && !storedUid)return null;
    currentProfile=await findProfile(currentUser?.uid||storedUid);
    if(!currentProfile){
      currentProfile={uid:currentUser.uid,name:currentUser.displayName||"",mobile:"",language:"हिंदी",district:"",cityVillage:"",profilePhotoURL:"",profilePhotoData:"",role:"user",createdAt:serverTimestamp()};
    }
    return currentProfile;
  }
  function show(html,title="परमात्मा एक"){
    root.innerHTML=`<div class="peTop"><button class="peBack" id="peBack">‹</button><div class="peTitle">${title}</div></div><div class="peWrap">${html}</div>`;
    root.style.display="block"; document.body.style.overflow="hidden";
    document.getElementById("peBack").onclick=()=>close();
  }
  function close(){root.style.display="none";root.innerHTML="";document.body.style.overflow="";if(stopPosts){stopPosts();stopPosts=null}}

  async function openProfile(){
    const p=await ensureProfile();
    show(`<div class="peHero"><img class="peAvatar" src="${avatar(p)}"><div class="peName">${esc(p.name||"मेरा प्रोफाइल")}</div><div class="peBadge">${roleLabel(p.role)}</div></div>
    <div class="peCard"><div class="peRow"><button class="peBtn pePrimary" id="peEdit">✏️ Edit Profile</button><button class="peBtn peGray" id="peLogout">🚪 Logout</button></div>
    <p style="margin-top:15px;line-height:1.8"><b>📱 मोबाइल:</b> ${esc(p.mobile||"—")}<br><b>🌐 भाषा:</b> ${esc(p.language||"—")}<br><b>📍 जिला:</b> ${esc(p.district||"—")}<br><b>🏠 शहर/गाँव:</b> ${esc(p.cityVillage||"—")}<br><b>🆔 User ID:</b> ${esc(p.uid||"—")}</p></div>`);
    document.getElementById("peEdit").onclick=openEditProfile;
    document.getElementById("peLogout").onclick=async()=>{sessionStorage.removeItem("parmatmaEkSession");await signOut(auth);alert("Logout हो गया।");close();if(window.parmatmaSetLoggedOut)window.parmatmaSetLoggedOut();};
  }

  async function compressProfileImage(file){return new Promise((resolve,reject)=>{const im=new Image();const fr=new FileReader();fr.onload=()=>{im.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));const x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(Error("फोटो तैयार नहीं हुई")),"image/jpeg",.82)};im.onerror=()=>reject(Error("फोटो पढ़ी नहीं गई"));im.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}
  async function imageToDataURL(file,max=512,quality=.65){const blob=await new Promise((resolve,reject)=>{const im=new Image(),fr=new FileReader();fr.onload=()=>{im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));const x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(Error("फोटो तैयार नहीं हुई")),"image/jpeg",quality)};im.onerror=()=>reject(Error("फोटो पढ़ी नहीं गई"));im.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)});if(blob.size>700000)throw Error("फोटो बहुत बड़ी है। कृपया छोटी फोटो चुनें।");return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
  async function openEditProfile(){
    const p=await ensureProfile();
    show(`<div class="peCard">
      <label class="peLabel">📷 Profile Photo<input class="peInput" id="pePhoto" type="file" accept="image/*"></label>
      <img id="pePreview" class="peAvatar" style="margin-top:10px" src="${avatar(p)}">
      <label class="peLabel">पूरा नाम<input class="peInput" id="peName" value="${esc(p.name)}"></label>
      <label class="peLabel">मोबाइल नंबर<input class="peInput" id="peMobile" inputmode="numeric" maxlength="10" value="${esc(p.mobile)}"></label>
      <label class="peLabel">भाषा<select class="peSelect" id="peLang"><option ${p.language==="हिंदी"?"selected":""}>हिंदी</option><option ${p.language==="मराठी"?"selected":""}>मराठी</option></select></label>
      <label class="peLabel">जिला<input class="peInput" id="peDistrict" value="${esc(p.district)}"></label>
      <label class="peLabel">शहर / गाँव<input class="peInput" id="peCity" value="${esc(p.cityVillage)}"></label>
      <button class="peBtn peGreen" id="peSave" style="width:100%;margin-top:15px">💾 प्रोफाइल सेव करें</button>
    </div>`);
    const fi=document.getElementById("pePhoto");
    fi.onchange=()=>{const f=fi.files?.[0];if(f){const r=new FileReader();r.onload=e=>document.getElementById("pePreview").src=e.target.result;r.readAsDataURL(f)}};
    document.getElementById("peSave").onclick=async()=>{
      const btn=document.getElementById("peSave");btn.disabled=true;btn.textContent="⏳ सेव हो रहा है...";
      try{
        let photoURL=p.profilePhotoURL||"";
        const f=fi.files?.[0];
        if(f){if(!f.type.startsWith("image/"))throw Error("केवल फोटो चुनें");if(f.size>5*1024*1024)throw Error("फोटो 5 MB से कम रखें");photoURL=await imageToDataURL(f,512,.65)}
        const data={uid:currentUser.uid,name:document.getElementById("peName").value.trim(),mobile:document.getElementById("peMobile").value.trim(),language:document.getElementById("peLang").value,district:document.getElementById("peDistrict").value.trim(),cityVillage:document.getElementById("peCity").value.trim(),profilePhotoURL:photoURL,profilePhotoData:photoURL,updatedAt:serverTimestamp()};
        if(p.id)await updateDoc(doc(db,"users",p.id),data);else{await setDoc(doc(db,"users",currentUser.uid),{...data,role:"user",createdAt:serverTimestamp()})}
        currentProfile={...p,...data,id:p.id||currentUser.uid};
        const top=document.getElementById("pmProfilePhoto");if(top){top.innerHTML=avatar(currentProfile).startsWith("data:")?"👤":`<img src="${currentProfile.profilePhotoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;}
        toast("✅ प्रोफाइल अपडेट हो गया।");openProfile();
      }catch(e){alert("❌ प्रोफाइल सेव नहीं हुआ\n\n"+e.message);btn.disabled=false;btn.textContent="💾 प्रोफाइल सेव करें"}
    };
  }

  function openLogin(){
    show(`<div class="peCard"><h2>🔐 Login</h2><label class="peLabel">Email<input class="peInput" id="peEmail" type="email" placeholder="आपका Email"></label><label class="peLabel">Password<input class="peInput" id="pePass" type="password" placeholder="Password"></label><button class="peBtn pePrimary" id="peLogin" style="width:100%;margin-top:15px">🔑 Login करें</button><hr style="margin:18px 0;border:0;border-top:1px solid #eee"><h3>📝 नया Account</h3><label class="peLabel">पूरा नाम<input class="peInput" id="peRegName"></label><button class="peBtn peGreen" id="peRegister" style="width:100%;margin-top:12px">✨ Account बनाएं</button><div class="peNotice" style="margin-top:14px">Email/Password provider Firebase Console में Enable होना जरूरी है।</div></div>`);
    document.getElementById("peLogin").onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.getElementById("peEmail").value.trim(),document.getElementById("pePass").value);alert("✅ Login सफल");close();}catch(e){alert("❌ Login नहीं हुआ\n\n"+e.message)}};
    document.getElementById("peRegister").onclick=async()=>{try{const email=document.getElementById("peEmail").value.trim(),pass=document.getElementById("pePass").value,name=document.getElementById("peRegName").value.trim();if(!email||pass.length<6||!name)throw Error("नाम, Email और कम से कम 6 अक्षरों का Password भरें");const c=await createUserWithEmailAndPassword(auth,email,pass);await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,name,mobile:"",language:"हिंदी",district:"",cityVillage:"",profilePhotoURL:"",profilePhotoData:"",role:"user",createdAt:serverTimestamp()});alert("🎉 Account बन गया");close();}catch(e){alert("❌ Account नहीं बना\n\n"+e.message)}};
  }

  async function loadUsers(){const s=await getDocs(collection(db,"users"));return s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const aa=a.createdAt?.seconds||0,bb=b.createdAt?.seconds||0;return bb-aa})}
  async function openSevakDirectory(){
    show(`<div class="peCard"><div class="peNotice">🔐 Admin/अधिकृत व्यक्ति यहाँ से पहले User को <b>सेवक</b> नियुक्त करेगा। केवल नियुक्त सेवक को आगे <b>मार्गदर्शक</b> बनाया जा सकेगा।</div><div id="peUsers"><div class="peEmpty">⏳ Users लोड हो रहे हैं...</div></div></div>`,"👥 सेवक निर्देशिका");
    watchSevakDirectory();
    try{
      const users=await loadUsers(),box=document.getElementById("peUsers");box.innerHTML="";
      if(!users.length){box.innerHTML='<div class="peEmpty">कोई User नहीं मिला।</div>';return}
      users.forEach(u=>{
        const card=document.createElement("div");card.className="peUser";
        card.innerHTML=`<img class="peSmallAvatar" src="${avatar(u)}"><div class="peUserMain"><div class="peUserName">${esc(u.name||"नाम नहीं")} ${u.role==="margdarshak"?"👑":u.role==="sevak"?"👥":""}</div><div class="peMeta">${esc(u.district||"")} • ${esc(u.cityVillage||"")}<br>${roleLabel(u.role)}</div></div><div class="peRow"></div>`;
        const actions=card.querySelector(".peRow");
        if(u.role!=="sevak"&&u.role!=="margdarshak")addAction(actions,"👥 सेवक बनाएं",()=>assignRole(u,"sevak"));
        if(u.role==="sevak")addAction(actions,"👑 मार्गदर्शक बनाएं",()=>assignRole(u,"margdarshak"));
        if(u.role==="sevak"||u.role==="margdarshak")addAction(actions,"↩️ User करें",()=>assignRole(u,"user"));
        box.appendChild(card);
      });
    }catch(e){document.getElementById("peUsers").innerHTML=`<div class="peEmpty">❌ Firebase से Users नहीं लोड हुए<br><br>${esc(e.message)}</div>`}
  }
  function addAction(parent,text,fn){const b=document.createElement("button");b.className="peBtn peGray";b.textContent=text;b.onclick=fn;parent.appendChild(b)}

// Sevak Directory realtime sync: every newly registered user appears automatically.
let __sevakUsersUnsub=null;
function watchSevakDirectory(){
  if(__sevakUsersUnsub) __sevakUsersUnsub();
  const box=document.getElementById("peUsers"); if(!box) return;
  __sevakUsersUnsub=onSnapshot(collection(db,"users"),snap=>{
    const users=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    box.innerHTML="";
    if(!users.length){box.innerHTML='<div class="peEmpty">अभी कोई Registered User नहीं है।</div>';return;}
    users.forEach(u=>{
      const card=document.createElement("div");card.className="peUser";
      card.innerHTML=`<img class="peSmallAvatar" src="${avatar(u)}"><div class="peUserMain"><div class="peUserName">${esc(u.name||"नाम नहीं")} ${u.role==="margdarshak"?"👑":u.role==="sevak"?"👥":""}</div><div class="peMeta">${esc(u.district||"")} • ${esc(u.cityVillage||"")}<br>${roleLabel(u.role)}</div></div><div class="peRow"></div>`;
      const actions=card.querySelector(".peRow");
      if(u.role!=="sevak"&&u.role!=="margdarshak")addAction(actions,"👥 सेवक बनाएं",()=>assignRole(u,"sevak"));
      if(u.role==="sevak")addAction(actions,"👑 मार्गदर्शक बनाएं",()=>assignRole(u,"margdarshak"));
      if(u.role==="sevak"||u.role==="margdarshak")addAction(actions,"↩️ User करें",()=>assignRole(u,"user"));
      box.appendChild(card);
    });
  },err=>{box.innerHTML=`<div class="peEmpty">❌ Firebase से Users नहीं लोड हुए<br><br>${esc(err.message||err)}</div>`;});
}
  async function assignRole(u,role){
    const pin=prompt("🔐 Admin Password डालें:");
    if(pin!=="4351"){if(pin!==null)alert("❌ गलत Password");return}
    if(role==="margdarshak"&&u.role!=="sevak"){alert("पहले इस व्यक्ति को सेवक निर्देशिका से सेवक नियुक्त करें।");return}
    if(!confirm((u.name||"User")+" को "+roleLabel(role)+" बनाना है?"))return;
    try{await updateDoc(doc(db,"users",u.id),{role,guideApproved:role==="margdarshak",guideApprovedAt:role==="margdarshak"?serverTimestamp():null});alert("✅ Role अपडेट हो गया");openSevakDirectory()}catch(e){alert("❌ Role update नहीं हुआ\n\n"+e.message)}
  }

  async function openGuides(){
    show(`<div class="peCard"><h2>👑 मार्गदर्शक मंडल</h2><div class="peNotice">यहाँ केवल वही सदस्य आएँगे जिन्हें <b>सेवक निर्देशिका</b> से मार्गदर्शक नियुक्त किया गया है।</div><div id="peGuides" style="margin-top:10px"><div class="peEmpty">⏳ लोड हो रहा है...</div></div></div>`,"👑 मार्गदर्शक मंडल");
    try{const users=await loadUsers(),gs=users.filter(u=>u.role==="margdarshak"),box=document.getElementById("peGuides");box.innerHTML=gs.length?"":"<div class='peEmpty'>अभी कोई मार्गदर्शक नियुक्त नहीं है।</div>";gs.forEach(u=>{const c=document.createElement("div");c.className="peUser";c.innerHTML=`<img class="peSmallAvatar" src="${avatar(u)}"><div class="peUserMain"><div class="peUserName">${esc(u.name)}</div><div class="peMeta">👑 मार्गदर्शक<br>📍 ${esc(u.district||"")} • ${esc(u.cityVillage||"")}</div></div>`;box.appendChild(c)})}catch(e){document.getElementById("peGuides").innerHTML="❌ "+esc(e.message)}
  }

  async function openPostsV2(){
    show(`<div class="peCard"><textarea class="peArea" id="pePostText" placeholder="अपना सुविचार, संदेश या सूचना लिखें..."></textarea><input class="peInput" id="pePostImg" type="file" accept="image/*"><button class="peBtn pePrimary" id="pePostSend" style="width:100%;margin-top:12px">📤 पोस्ट करें</button></div><h2 style="margin:16px 3px 8px">📢 सभी पोस्ट</h2><div id="pePosts"><div class="peEmpty">⏳ पोस्ट लोड हो रही हैं...</div></div>`,"✍️ पोस्ट / सुविचार");
    await refreshPostsV2();
  }
  async function refreshPostsV2(){
    const box=document.getElementById("pePosts");if(!box)return;
    try{
      const q=query(collection(db,"posts"),orderBy("createdAtMs","desc"),limit(50));
      if(stopPosts)stopPosts();
      stopPosts=onSnapshot(q,async snap=>{
        const arr=snap.docs.map(d=>({id:d.id,...d.data()}));box.innerHTML="";
        if(!arr.length){box.innerHTML='<div class="peEmpty">अभी कोई पोस्ट नहीं है।</div>';return}
        const profiles={};
        await Promise.all(arr.map(async x=>{if(x.authorUid)profiles[x.authorUid]=await findProfile(x.authorUid)}));
        arr.forEach(d=>{
          const u=profiles[d.authorUid]||{name:d.authorName||"परमात्मा एक सदस्य",role:d.authorRole||"user",profilePhotoURL:d.authorPhotoURL||""};
          const c=document.createElement("div");c.className="peCard";
          c.innerHTML=`<div class="pePostHead"><img src="${avatar(u)}"><div><div class="pePostAuthor">${esc(u.name||"नाम उपलब्ध नहीं")}</div><div class="pePostRole">${roleLabel(u.role)}</div></div></div><div class="pePostText">${esc(d.text||"")}</div>${(d.imageURL||d.imageData)?`<img class="pePostImg" src="${esc(d.imageURL||d.imageData)}">`:""}<div class="peMeta" style="margin-top:9px">📅 ${d.createdAtMs?new Date(d.createdAtMs).toLocaleString("hi-IN"):"अभी"}</div>`;
          if(d.authorUid===currentUser?.uid){const del=document.createElement("button");del.className="peBtn peDanger";del.style.marginTop="10px";del.textContent="🗑️ मेरी पोस्ट Delete";del.onclick=async()=>{del.disabled=true;del.textContent="⏳ Delete हो रही है...";try{await deleteDoc(doc(db,"posts",d.id));toast("✅ आपकी पोस्ट Delete हो गई।")}catch(e){del.disabled=false;del.textContent="🗑️ मेरी पोस्ट Delete";toast("❌ पोस्ट Delete नहीं हुई: "+(e?.message||"त्रुटि"))}};c.appendChild(del)}
          box.appendChild(c);
        });
      });
    }catch(e){box.innerHTML=`<div class="peEmpty">❌ ${esc(e.message)}</div>`}
  }
  async function sendPost(){
    const text=document.getElementById("pePostText").value.trim(),fi=document.getElementById("pePostImg"),file=fi.files?.[0];
    if(!text&&!file){alert("कुछ लिखें या फोटो चुनें");return}
    const p=await ensureProfile(),btn=document.getElementById("pePostSend");btn.disabled=true;btn.textContent="⏳ पोस्ट हो रही है...";
    try{
      let imageURL="";
      if(file){
        if(!file.type.startsWith("image/"))throw Error("केवल फोटो चुनें");
        if(file.size>8*1024*1024)throw Error("पोस्ट फोटो 8 MB से कम रखें");
        imageURL=await imageToDataURL(file,640,.62);
        if(imageURL.length>950000)throw Error("पोस्ट फोटो बहुत बड़ी है। कृपया छोटी फोटो चुनें");
      }
      await addDoc(collection(db,"posts"),{text,imageURL:"",imageData:imageURL,authorUid:currentUser.uid,authorName:p?.name||currentUser.email||"सदस्य",authorRole:p?.role||"user",authorPhotoURL:p?.profilePhotoURL||p?.profilePhotoData||"",createdAt:serverTimestamp(),createdAtMs:Date.now()});
      document.getElementById("pePostText").value="";fi.value="";alert("✅ पोस्ट हो गई");
    }catch(e){alert("❌ पोस्ट नहीं हुई\n\n"+e.message)}finally{btn.disabled=false;btn.textContent="📤 पोस्ट करें"}
  }

  function openSimple(title,content){show(`<div class="peCard">${content}</div>`,title)}
  function openSchedules(type){
    if(typeof window.openSchedulePanel === "function"){
      close();
      window.openSchedulePanel(type==="charcha"?"discussion":"havan");
    } else {
      const t=type==="charcha"?"🤝 चर्चा बैठक शेड्यूल":"🔥 हवन शेड्यूल";
      openSimple(t,`<h2>${t}</h2><div class="peNotice">Firebase schedule system लोड नहीं हुआ।</div>`);
    }
  }
  function openSankalp(){ if(window.__peOpenSankalpFinal){close();window.__peOpenSankalpFinal()} else openSimple("🙏 आज का संकल्प","मानव धर्म के सत्य, मर्यादा और प्रेम के मार्ग पर चलने का संकल्प लें।") }
  function openRulesV2(){ if(window.__peOpenRulesFinal){close();window.__peOpenRulesFinal()} else openSimple("📜 नियम","सत्य बोलना • मर्यादा पालना • प्रेम से व्यवहार करना"); }

  function hookUI(){
    document.addEventListener("click",e=>{
      const el=e.target.closest&&e.target.closest("#parmatmaMainMenu, #pmProfilePhoto, #pmPlusButton, #pmMargdarshak, #pmSevak, #pmCharcha, #pmHavan, #pmSankalpButton, #pePostSend");
      if(!el)return;
      const u=auth.currentUser;
      const login=()=>{ if(window.parmatmaEmailLogin) window.parmatmaEmailLogin(); else openLogin(); };

      const profile=e.target.closest("#pmProfilePhoto");
      if(profile){ e.preventDefault(); e.stopImmediatePropagation();
        if(window.parmatmaOpenProfileV11) window.parmatmaOpenProfileV11();
        else if(u&&!u.isAnonymous) openProfile(); else login();
        return;
      }
      const plus=e.target.closest("#pmPlusButton");
      if(plus){ e.preventDefault(); e.stopImmediatePropagation();
        if(u&&!u.isAnonymous) openPostsV2(); else login();
        return;
      }
      const card=e.target.closest("#pmMargdarshak");
      if(card){ e.preventDefault(); e.stopImmediatePropagation();
        if(u&&!u.isAnonymous) openGuides(); else login();
        return;
      }
      const sev=e.target.closest("#pmSevak");
      if(sev){ e.preventDefault(); e.stopImmediatePropagation();
        if(u&&!u.isAnonymous) openSevakDirectory(); else login();
        return;
      }
      const ch=e.target.closest("#pmCharcha");
      if(ch){ e.preventDefault(); e.stopImmediatePropagation();
        if(u&&!u.isAnonymous) openSchedules("charcha"); else login();
        return;
      }
      const hv=e.target.closest("#pmHavan");
      if(hv){ e.preventDefault(); e.stopImmediatePropagation();
        if(u&&!u.isAnonymous) openSchedules("havan"); else login();
        return;
      }
      const sank=e.target.closest("#pmSankalpButton");
      if(sank){ e.preventDefault(); e.stopImmediatePropagation(); openSankalp(); return; }
      const rules=e.target.closest("#parmatmaMainMenu .pm-bottom-nav .pm-nav-item");
      if(rules && (rules.innerText||"").includes("नियम")){ e.preventDefault(); e.stopImmediatePropagation(); openRulesV2(); return; }
      const post=e.target.closest("#pePostSend");
      if(post){ e.preventDefault(); e.stopImmediatePropagation(); if(u&&!u.isAnonymous) sendPost(); else login(); return; }
    },true);
  }

  onAuthStateChanged(auth,async u=>{
    currentUser=u;
    if(u) await ensureProfile();
  });
  hookUI();
  // If the existing app uses anonymous auth, profile icon still opens My Profile.
  window.parmatmaV2={openProfile,openLogin,openSevakDirectory,openGuides,openPostsV2};
})();
</script>

      }

    }

  }

  setTimeout(checkRegistration, 500);
  setTimeout(checkRegistration, 1500);
  setTimeout(checkRegistration, 3000);


  // -----------------------------------------
  // Registration सफल होने पर याद रखो
  // -----------------------------------------
  const observer = new MutationObserver(function () {

    const button = document.getElementById("continueRegistration");

    if (button) {

      const text = button.innerText || "";

      if (
        text.includes("Registration सफल") ||
        text.includes("सफल")
      ) {

        localStorage.setItem(
          REGISTERED_KEY,
          "yes"
        );

        const registration =
          document.getElementById("registrationScreen");

        if (registration) {
          registration.style.display = "none";
        }

      }

    }

  });

  observer.observe(document.body, {
    childList: true,
    subtree: true,
    characterData: true
  });


  // -----------------------------------------
  // Registration button पर नजर रखो
  // -----------------------------------------
  document.addEventListener("click", function (e) {

    if (
      e.target &&
      e.target.id === "continueRegistration"

      }, 2000);

    document.getElementById("registrationScreen");

    registration.style.display = "none";
  }

onAuthStateChanged(auth, async function(user) {

  if (!user) return;

  try {

    // इस Firebase UID का profile खोजो
    const q = query(
      collection(db, "users"),
      where("uid", "==", user.uid)
    );

    const result = await getDocs(q);

    // अगर Firebase में profile पहले से है
    if (!result.empty) {

      console.log(
        "पुराना Registration मिला ✅"
      );

      openHome();

    }

  } catch (error) {

    console.log(
      "Existing user check:",
      error
    );

  }

});
